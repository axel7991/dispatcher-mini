
name: Deploy Dispatcher Mini to EC2

on:
  workflow_run:
    workflows: ["Python Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user

            if [ ! -d dispatcher-mini/.git ]; then
              git clone https://github.com/axel7991/dispatcher-mini.git
            fi

            cd dispatcher-mini
            git fetch origin main
            git checkout main
            git reset --hard "${{ github.event.workflow_run.head_sha }}"

            docker build -t dispatcher-mini:latest .

            docker stop dispatcher-mini 2>/dev/null || true
            docker rm dispatcher-mini 2>/dev/null || true

            docker run -d \
              --name dispatcher-mini \
              --restart unless-stopped \
              --env-file /home/ec2-user/dispatcher-mini/.env \
              -e DATABASE_PATH=/app/data/dispatcher.db \
              -p 127.0.0.1:8002:8000 \
              -v dispatcher-mini-data:/app/data \
              dispatcher-mini:latest
